[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholarpath-data"
version = "0.1.0"
description = "Data collection foundation for ScholarPath AI: load, normalize, validate and export scholarship records."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0.6",  # see requirements.txt for why 3.0.6 is excluded
    "openpyxl>=3.1",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
scholarpath-data = "scholarpath_data.pipeline:main"
scholarpath-inspect = "scholarpath_data.load_excel:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
